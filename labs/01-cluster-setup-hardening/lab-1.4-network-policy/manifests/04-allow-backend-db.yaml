apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-db
  namespace: lab-netpol
spec:
  podSelector:
    matchLabels: { tier: db }
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels: { tier: backend }
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-egress-to-db
  namespace: lab-netpol
spec:
  podSelector:
    matchLabels: { tier: backend }
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels: { tier: db }
      ports:
        - protocol: TCP
          port: 80
