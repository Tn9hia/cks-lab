apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: lab-netpol
spec:
  podSelector:
    matchLabels: { tier: backend }
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels: { tier: frontend }
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-egress-to-backend
  namespace: lab-netpol
spec:
  podSelector:
    matchLabels: { tier: frontend }
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels: { tier: backend }
      ports:
        - protocol: TCP
          port: 80
