apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: lab-netpol
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend, tier: frontend }
  template:
    metadata:
      labels: { app: frontend, tier: frontend }
    spec:
      containers:
        - name: frontend
          image: nginx:1.27
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: lab-netpol
spec:
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80 }]
---
