apiVersion: audit.k8s.io/v1
kind: Policy
rules:
  # 1. Log toàn bộ (metadata + request + response) khi động tới secrets
  - level: RequestResponse
    resources:
      - group: ""
        resources: ["secrets"]

  # 2. Log request body khi ai đó exec/attach vào container — quan trọng để
  #    trace hành vi khả nghi sau khi có alert từ Falco (xem Domain 5)
  - level: Request
    resources:
      - group: ""
        resources: ["pods/exec", "pods/attach", "pods/portforward"]

  # 3. Log metadata cho các thay đổi trên pods/deployments — đủ để biết
  #    who/when mà không phình dung lượng log
  - level: Metadata
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: ""
        resources: ["pods"]
      - group: "apps"
        resources: ["deployments", "replicasets"]

  # 4. Bỏ qua hoàn toàn các request đọc nhiều nhưng ít giá trị điều tra
  - level: None
    verbs: ["get", "watch", "list"]
    resources:
      - group: ""
        resources: ["events"]
      - group: "coordination.k8s.io"
        resources: ["leases"]

  # 5. Catch-all cuối cùng: mọi thứ khác log ở mức Metadata
  - level: Metadata
