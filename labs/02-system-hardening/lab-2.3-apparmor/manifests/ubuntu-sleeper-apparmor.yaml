apiVersion: v1
kind: Pod
metadata:
  name: ubuntu-sleeper
spec:
  nodeName: k8s-worker-02
  securityContext:
    appArmorProfile:
      type: Localhost
      localhostProfile: apparmor-deny-write
  containers:
    - name: ubuntu-sleeper
      image: ubuntu
      command: ["sh", "-c", "echo 'Sleeping for an hour!' && sleep 1h"]
