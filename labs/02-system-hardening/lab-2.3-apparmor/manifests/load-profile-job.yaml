apiVersion: batch/v1
kind: Job
metadata:
  name: load-apparmor-profile
spec:
  backoffLimit: 0
  template:
    spec:
      nodeName: k8s-worker-02
      hostPID: true
      restartPolicy: Never
      containers:
        - name: loader
          image: busybox:1.36
          command:
            - nsenter
            - "-t"
            - "1"
            - "-m"
            - "-u"
            - "-n"
            - "-i"
            - "--"
            - apparmor_parser
            - "-q"
            - "-r"
            - /etc/apparmor.d/apparmor-deny-write
          securityContext:
            privileged: true
