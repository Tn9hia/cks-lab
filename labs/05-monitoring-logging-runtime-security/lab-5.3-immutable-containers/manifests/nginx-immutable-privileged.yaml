apiVersion: v1
kind: Pod
metadata:
  labels:
    run: nginx
  name: nginx-immutable
spec:
  containers:
    - image: nginx:1.27
      name: nginx
      securityContext:
        readOnlyRootFilesystem: true
        privileged: true
      volumeMounts:
        - name: cache-volume
          mountPath: /var/cache/nginx
        - name: runtime-volume
          mountPath: /var/run
  volumes:
    - name: cache-volume
      emptyDir: {}
    - name: runtime-volume
      emptyDir: {}
