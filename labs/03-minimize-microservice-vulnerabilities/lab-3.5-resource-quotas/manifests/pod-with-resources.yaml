apiVersion: v1
kind: Pod
metadata:
  name: resource-limited-pod
  namespace: team-a
spec:
  containers:
    - name: resource-limited-container
      image: nginx:1.27
      resources:
        requests:
          cpu: "250m"
          memory: "64Mi"
        limits:
          cpu: "500m"
          memory: "128Mi"
